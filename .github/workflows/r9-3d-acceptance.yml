name: r9 3D acceptance

on:
  push:
    branches: [qa/3d-r9-20261004]

permissions:
  contents: read

concurrency:
  group: r9-3d-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QA_MODE: published
    defaults:
      run:
        working-directory: tests/3d-acceptance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/3d-acceptance/package-lock.json
      - name: Record the actual environment
        run: |
          mkdir -p results
          { uname -a; node --version; npm --version; google-chrome --version; } > results/environment.txt
          cat results/environment.txt
      - name: Install locked test dependencies and Chinese fonts
        if: env.QA_MODE != 'published'
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Serve candidate files without publishing the website
        if: env.QA_MODE != 'published'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory ../.. > results/server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
      - name: Run Chrome and real WebGL acceptance
        if: env.QA_MODE != 'published'
        run: node run.mjs --${QA_MODE} --headless --cloud-ci --software-webgl --url 'http://127.0.0.1:8765/?assembly=comm-backplate&v=assembly-20261004-r10' --repair-only --output results/cloud
      - name: Verify published files match the visually tested candidate
        if: env.QA_MODE == 'published'
        run: node verify-published.mjs
      - name: Preserve screenshots and errors even after failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r9-3d-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/3d-acceptance/results/
          if-no-files-found: error
          retention-days: 30
