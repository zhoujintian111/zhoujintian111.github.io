<style>
:root{color-scheme:dark;--background:#0b1015;--foreground:#edf2f5;--card:#121a22;--card-foreground:#edf2f5;--popover:#151e27;--popover-foreground:#edf2f5;--primary:#ff5a00;--primary-foreground:#fff;--secondary:#202b35;--secondary-foreground:#edf2f5;--muted:#1b252e;--muted-foreground:#a7b1b9;--accent:#25313c;--accent-foreground:#fff;--destructive:#ef4444;--border:#2b3741;--input:#33414d;--ring:#ff5a00;--blue:#4aa3ff;--orange:#ff5a00;--green:#3ccf91;--red:#f05d5e;--purple:#9c7cff;--yellow:#f5c451;--font-sans:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;--font-size-base:14px}
html,body{margin:0;min-height:100%;background:#0b1015;color:#edf2f5;font-family:var(--font-sans)}
body{padding:12px}.btn{appearance:none;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:8px;padding:8px 12px;font:inherit}.btn-primary{background:var(--primary);color:var(--primary-foreground)}.btn-ghost{background:transparent}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav-link{appearance:none;border:0;background:transparent;color:var(--muted-foreground);border-radius:8px;padding:8px 11px;font:inherit}.nav-link.active{background:var(--primary);color:var(--primary-foreground)}.viz-badge{display:inline-flex;border-radius:999px;padding:5px 9px;background:var(--accent);color:var(--accent-foreground)}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}

<div id="gx-ccgx-quality-gate" aria-label="Victron Color Control GX 独立高精样机">
  <style>
    #gx-ccgx-quality-gate {
      width: 100%;
      color: var(--foreground);
      background: transparent;
      font-family: var(--font-sans);
    }
    #gx-ccgx-quality-gate * { box-sizing: border-box; }
    #gx-ccgx-quality-gate .gx-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    #gx-ccgx-quality-gate .gx-head h2 { margin: 0; }
    #gx-ccgx-quality-gate .gx-head p { margin: 3px 0 0; }
    #gx-ccgx-quality-gate .gx-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 610px;
      overflow: hidden;
      background:
        radial-gradient(circle at 49% 37%, light-dark(rgba(255,255,255,.96), rgba(91,104,115,.24)) 0, transparent 35%),
        linear-gradient(148deg, light-dark(rgb(225,229,232), rgb(27,33,38)), light-dark(rgb(192,198,202), rgb(7,11,14)));
      perspective: 1150px;
      isolation: isolate;
    }
    #gx-ccgx-quality-gate .gx-stage::before {
      content: "";
      position: absolute;
      width: min(670px, 84%);
      height: 160px;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,.44), transparent 68%);
      filter: blur(13px);
      opacity: .75;
    }
    #gx-ccgx-quality-gate .gx-rig {
      --gx-angle-y: 0deg;
      --gx-angle-x: 0deg;
      position: relative;
      width: 360px;
      height: 390px;
      transform-style: preserve-3d;
      transform: rotateX(var(--gx-angle-x)) rotateY(var(--gx-angle-y));
      transition: transform 520ms cubic-bezier(.2,.8,.2,1);
      z-index: 1;
    }
    #gx-ccgx-quality-gate .gx-face {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    #gx-ccgx-quality-gate .gx-front,
    #gx-ccgx-quality-gate .gx-back {
      width: 360px;
      height: 390px;
      margin-left: -180px;
      margin-top: -195px;
    }
    #gx-ccgx-quality-gate .gx-front {
      transform: translateZ(42px);
      filter: drop-shadow(0 24px 27px rgba(0,0,0,.30));
    }
    #gx-ccgx-quality-gate .gx-front img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    #gx-ccgx-quality-gate .gx-front::after {
      content: "";
      position: absolute;
      left: 9.1%;
      top: 6.7%;
      width: 81.3%;
      height: 43.3%;
      border-radius: 2px;
      background: linear-gradient(126deg, rgba(255,255,255,.18), transparent 31%, transparent 73%, rgba(131,183,216,.08));
      mix-blend-mode: screen;
      pointer-events: none;
    }
    #gx-ccgx-quality-gate .gx-back {
      transform: rotateY(180deg) translateZ(42px);
      clip-path: polygon(2% 0,98% 0,100% 5%,100% 95%,98% 100%,2% 100%,0 95%,0 5%);
      background:
        linear-gradient(90deg, rgba(255,255,255,.035), transparent 10%, transparent 90%, rgba(255,255,255,.025)),
        linear-gradient(145deg, rgb(20,23,25), rgb(8,10,11));
    }
    #gx-ccgx-quality-gate .gx-side {
      width: 84px;
      height: 366px;
      margin-left: -42px;
      margin-top: -183px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.12), transparent 9%, transparent 72%, rgba(0,0,0,.48)),
        repeating-linear-gradient(0deg, transparent 0 25px, rgba(255,255,255,.022) 26px, transparent 27px),
        rgb(23,27,29);
    }
    #gx-ccgx-quality-gate .gx-right { transform: rotateY(90deg) translateZ(180px); }
    #gx-ccgx-quality-gate .gx-left { transform: rotateY(-90deg) translateZ(180px); }
    #gx-ccgx-quality-gate .gx-top,
    #gx-ccgx-quality-gate .gx-bottom {
      width: 348px;
      height: 84px;
      margin-left: -174px;
      margin-top: -42px;
      background:
        linear-gradient(0deg, rgba(255,255,255,.11), transparent 22%, transparent 75%, rgba(0,0,0,.38)),
        rgb(23,27,29);
    }
    #gx-ccgx-quality-gate .gx-top { transform: rotateX(90deg) translateZ(195px); }
    #gx-ccgx-quality-gate .gx-bottom { transform: rotateX(-90deg) translateZ(195px); }
    #gx-ccgx-quality-gate .gx-dim {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 3;
      padding: 8px 10px;
      color: light-dark(rgb(25,30,34), rgb(229,235,238));
      background: light-dark(rgba(255,255,255,.84), rgba(8,12,15,.74));
      backdrop-filter: blur(10px);
    }
    #gx-ccgx-quality-gate .gx-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    #gx-ccgx-quality-gate .gx-note {
      margin: 8px 0 0;
      text-align: center;
    }
    @media (max-width: 560px) {
      #gx-ccgx-quality-gate .gx-head { display: block; }
      #gx-ccgx-quality-gate .gx-head .viz-badge { display: inline-block; margin-top: 8px; }
      #gx-ccgx-quality-gate .gx-stage { min-height: 500px; }
      #gx-ccgx-quality-gate .gx-rig { transform: scale(.78) rotateX(var(--gx-angle-x)) rotateY(var(--gx-angle-y)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #gx-ccgx-quality-gate .gx-rig { transition: none; }
    }
  </style>

  <div class="gx-controls" aria-label="查看角度">
    <button class="btn" type="button" data-view="left">左侧 30°</button>
    <button class="btn btn-primary" type="button" data-view="front" aria-pressed="true">正面</button>
    <button class="btn" type="button" data-view="right">右侧 30°</button>
    <button class="btn" type="button" data-view="side">侧面厚度</button>
  </div>
  <p class="gx-note text-small text-muted" data-note aria-live="polite">正面：核对屏幕、品牌丝印、七键布局与外壳轮廓</p>

  <script>
    (() => {
      const root = document.getElementById('gx-ccgx-quality-gate');
      const rig = root.querySelector('[data-rig]');
      const note = root.querySelector('[data-note]');
      const states = {
        front: ['0deg', '0deg', '正面：核对屏幕、品牌丝印、七键布局与外壳轮廓'],
        left: ['28deg', '2deg', '左侧 30°：核对前面板起伏、按键凸度与 28 mm 总厚度'],
        right: ['-28deg', '2deg', '右侧 30°：核对玻璃反射、壳体倒角与侧面层次'],
        side: ['-78deg', '0deg', '侧面：核对 28 mm 最大外廓厚度']
      };
      root.querySelectorAll('[data-view]').forEach((button) => {
        button.addEventListener('click', () => {
          const [angleY, angleX, label] = states[button.dataset.view];
          rig.style.setProperty('--gx-angle-y', angleY);
          rig.style.setProperty('--gx-angle-x', angleX);
          note.textContent = label;
          root.querySelectorAll('[data-view]').forEach((item) => {
            const selected = item === button;
            item.classList.toggle('btn-primary', selected);
            item.setAttribute('aria-pressed', String(selected));
          });
        });
      });
    })();
  </script>
</div>

<script>
(() => {
  const rig=document.querySelector('[data-rig]');if(!rig)return;
  rig.title='旧版 Color Control GX';rig.style.cursor='pointer';
  rig.addEventListener('click',()=>parent.postMessage({type:'aiko-device',version:'old',id:'gx-old',title:'旧版 Color Control GX',text:'原车GX设备；外形130 × 120 × 28 mm，作为拆换、开孔与安装位置基准。'},location.origin));
})();
</script>
