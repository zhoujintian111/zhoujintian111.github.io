  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from '../vendor/three/examples/jsm/controls/OrbitControls.js';
    window.__AIKO_THREE_OFFLINE__={THREE,OrbitControls};
    const root = document.getElementById('aiko-interior-four-cameras-v02');
    const stage = root.querySelector('[data-stage]');
    const canvas = root.querySelector('[data-canvas]');
    const loading = root.querySelector('[data-loading]');
    const viewName = root.querySelector('[data-view-name]');
    const viewNote = root.querySelector('[data-view-note]');
    const resetButton = root.querySelector('[data-reset]');
    const openButton = root.querySelector('[data-toggle-open]');
    const status = root.querySelector('[data-status]');

    const resolveCssColor = (name) => {
      const probe = document.createElement('span');
      probe.style.color = `var(${name})`;
      probe.style.position = 'absolute';
      probe.style.visibility = 'hidden';
      root.appendChild(probe);
      const value = getComputedStyle(probe).color;
      probe.remove();
      return value;
    };

    const start = async () => {
      const { THREE, OrbitControls } = window.__AIKO_THREE_OFFLINE__;
      const {makeGxTouch,gxTouchSpec}=await import('../gx-touch-model.js');
      const gxPhoto=await new THREE.TextureLoader().loadAsync('../images/gx-touch-50-official.png');
      gxPhoto.colorSpace=THREE.SRGBColorSpace;
      gxPhoto.offset.set(49/1925,48/1307);gxPhoto.repeat.set(1804/1925,1210/1307);
      await document.fonts.load('300 75px "AIKO-Axiforma-Fixed"').catch((error) => {
        console.warn('AIKO embedded font load did not block scene startup.', error);
      });

      const theme = {
        scene: resolveCssColor('--scene-bg'),
        floor: resolveCssColor('--scene-floor'),
        border: resolveCssColor('--border')
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(theme.scene);
      scene.fog = new THREE.FogExp2(new THREE.Color(theme.scene), 0.018);

      const camera = new THREE.PerspectiveCamera(43, 1, 0.025, 60);
      camera.position.set(-3.17, 1.52, 0.02);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.76;

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(0.61, 1.57, -0.03);
      controls.minDistance = 0.7;
      controls.maxDistance = 6.8;
      controls.minPolarAngle = Math.PI * 0.18;
      controls.maxPolarAngle = Math.PI * 0.78;
      controls.enablePan = false;

      scene.add(new THREE.HemisphereLight(0xdfe8ec, 0x15191b, 1.12));
      const ceilingLight = new THREE.RectAreaLight(0xf1f1ea, 5.0, 3.2, 1.1);
      ceilingLight.position.set(-1.35, 2.43, 0);
      ceilingLight.lookAt(-1.35, 0.65, 0);
      scene.add(ceilingLight);
      const doorLight = new THREE.RectAreaLight(0xd8edf3, 4.2, 2.1, 1.7);
      doorLight.position.set(-0.20, 1.62, 1.00);
      doorLight.lookAt(-0.20, 1.62, 0);
      scene.add(doorLight);
      const warmLight = new THREE.PointLight(0xff8c54, 1.6, 5.0);
      warmLight.position.set(0.55, 2.28, 0.72);
      scene.add(warmLight);
      // GX近景专用柔光，仅在“GX正面”固定镜头启用，不影响其他镜头。
      const gxDetailLight = new THREE.RectAreaLight(0xf1f4f5, 1.42, 0.21, 0.15);
      gxDetailLight.position.set(0.54, 2.270, 0.815);
      gxDetailLight.lookAt(0.812, 2.180, 0.915);
      gxDetailLight.visible = false;
      scene.add(gxDetailLight);
      const gxEdgeLight = new THREE.PointLight(0x91b9c8, 0.34, 0.72);
      gxEdgeLight.position.set(0.69, 2.105, 1.025);
      gxEdgeLight.visible = false;
      scene.add(gxEdgeLight);

      const locked = Object.freeze({
        vehicleLength: 7.200,
        vehicleWidth: 2.150,
        vehicleHeight: 3.000,
        cargoLength: 4.620,
        moduleLength: 1.762,
        moduleWidth: 1.134,
        moduleThickness: 0.030,
        televisionDiagonalInches: 43,
        // Victron Color Control GX 官方外形（H × W × D）：130 × 120 × 28 mm。
        gxHeight: 0.130,
        gxWidth: 0.120,
        gxDepth: 0.028
      });

      const pvTexture = (() => {
        const el = document.createElement('canvas');
        el.width = 512;
        el.height = 768;
        const ctx = el.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 512, 768);
        gradient.addColorStop(0, '#050607');
        gradient.addColorStop(0.42, '#121517');
        gradient.addColorStop(1, '#060809');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 768);
        for (let x = 3; x < 512; x += 5) {
          ctx.fillStyle = x % 25 === 3 ? 'rgba(255,255,255,.028)' : 'rgba(255,255,255,.011)';
          ctx.fillRect(x, 0, 1, 768);
        }
        for (let y = 11; y < 768; y += 21) {
          ctx.fillStyle = 'rgba(255,255,255,.012)';
          ctx.fillRect(0, y, 512, 1);
        }
        const texture = new THREE.CanvasTexture(el);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      })();

      const roundedOutline = (height, width, radius, segments = 7) => {

        const corners = [
          [hy - r, hz - r, 0, Math.PI * 0.5],
          [hy - r, -hz + r, Math.PI * 0.5, Math.PI],
          [-hy + r, -hz + r, Math.PI, Math.PI * 1.5],
          [-hy + r, hz - r, Math.PI * 1.5, Math.PI * 2]
        ];
        const points = [];
        corners.forEach(([cy, cz, a0, a1]) => {
          for (let i = 0; i <= segments; i += 1) {
            const a = a0 + (a1 - a0) * (i / segments);
            points.push({ y: cy + Math.sin(a) * r, z: cz + Math.cos(a) * r });
          }
        });
        return points;
      };

      const roundedPrismGeometry = (depth, height, width, radius, segments = 7) => {
        const points = roundedOutline(height, width, radius, segments);
        const positions = [];
        const normals = [];
        const uvs = [];
        const push = (x, y, z, nx, ny, nz, u, v) => {
          positions.push(x, y, z);
          normals.push(nx, ny, nz);
          uvs.push(u, v);
        };
        const pushTri = (a, b, c, n) => {
          [a, b, c].forEach((p) => push(p.x, p.y, p.z, n.x, n.y, n.z, p.z / width + 0.5, p.y / height + 0.5));
        };
        const frontX = -depth * 0.5;
        const backX = depth * 0.5;
        for (let i = 0; i < points.length; i += 1) {
          const j = (i + 1) % points.length;
          const a = points[i];
          const b = points[j];
          pushTri(
            { x: frontX, y: 0, z: 0 },
            { x: frontX, y: a.y, z: a.z },
            { x: frontX, y: b.y, z: b.z },
            { x: -1, y: 0, z: 0 }
          );
          pushTri(
            { x: backX, y: 0, z: 0 },
            { x: backX, y: b.y, z: b.z },
            { x: backX, y: a.y, z: a.z },
            { x: 1, y: 0, z: 0 }
          );
          const dy = b.y - a.y;
          const dz = b.z - a.z;
          const length = Math.hypot(dy, dz) || 1;
          const sideNormal = { x: 0, y: -dz / length, z: dy / length };
          pushTri(
            { x: frontX, y: a.y, z: a.z },
            { x: backX, y: a.y, z: a.z },
            { x: backX, y: b.y, z: b.z },
            sideNormal
          );
          pushTri(
            { x: frontX, y: a.y, z: a.z },
            { x: backX, y: b.y, z: b.z },
            { x: frontX, y: b.y, z: b.z },
            sideNormal

        const tri = (a, b, c, n) => {

          t: [-0.56, 1.70, 0.88],
          fov: 47,
          label: '镜头 2 · 组件侧',
          note: '沿中央通道斜看右侧组件、玻璃门和白色展台的连续关系。'
        },
        'tv-side': {
          mode: 'interior',
          p: [-1.05, 1.56, -0.04],
          t: [0.56, 1.74, -0.10],
          fov: 45,
          label: '镜头 3 · 电视侧',
          note: '正对凸出的电路仓展示面，确认电视、FIND YOUR POWER和AIKO标志。'
        },
        'front-diagonal': {
          mode: 'interior',
          p: [-0.02, 1.48, -0.70],
          t: [0.69, 1.90, 0.42],
          fov: 46,
          label: '镜头 4 · GX与玻璃门',
          note: '查看电视右侧的 GX Touch 50，屏幕中心距车内地板1450 mm。'
        },
        'gx-front': {
          mode: 'interior',
          p: [0.430, 2.113, 0.940],
          t: [0.828, 2.113, 0.940],
          fov: 28,
          label: '镜头 5 · GX正面',
          note: '标准版 GX Touch 50：128.2 × 87.1 × 12.4 mm；屏幕中心距车内地板1450 mm。'
        }
      };

      cameraViews['gx-installation']={mode:'interior',p:[-1.70,1.90,.88],t:[.75,1.66,.36],fov:46,label:'GX Touch 50 · 电视右侧',note:'屏幕中心距车内地板1450 mm；屏幕与电视同侧可近距查看。'};
      cameraViews['gx-mount']={mode:'interior',p:[.37,2.24,1.025],t:[.79,2.113,.94],fov:36,label:'原厂固定方式',note:'标准版随附固定框：4点固定，屏幕贴面；孔位及穿线槽按官方模板。'};
      let selectedView = 'gx-installation';
      let cameraTween = null;
      const moveCamera = (name, instant = false) => {
        selectedView = name;
        const target = cameraViews[name];
        const exteriorMode = target.mode === 'exterior';
        exteriorWorld.visible = exteriorMode;
        world.visible = !exteriorMode;
        exteriorKey.visible = exteriorMode;
        exteriorRim.visible = exteriorMode;
        exteriorWarm.visible = exteriorMode;
        ceilingLight.visible = !exteriorMode;
        doorLight.visible = !exteriorMode;
        warmLight.visible = !exteriorMode;
        gxDetailLight.visible = ['gx-front','gx-mount'].includes(name);
        gxEdgeLight.visible = name === 'gx-front';
        shadowPad.visible = !exteriorMode;
        openButton.hidden = !exteriorMode;
        controls.minDistance = exteriorMode ? 5.1 : (['gx-front','gx-mount'].includes(name) ? 0.12 : 0.4);
        controls.maxDistance = exteriorMode ? 18 : 6.8;
        controls.minPolarAngle = exteriorMode ? 0 : Math.PI * 0.18;
        controls.maxPolarAngle = exteriorMode ? Math.PI * 0.49 : Math.PI * 0.78;
        controls.enablePan = true;
        gxTouch.display.position.x=name==='gx-mount'?-.075:0;
        gxDimensions.visible=name==='gx-installation';
        renderer.toneMappingExposure = exteriorMode ? 0.83 : (name === 'gx-front' ? 0.70 : 0.76);
        scene.fog.density = exteriorMode ? 0.026 : 0.018;
        status.textContent = exteriorMode
          ? `车身v01 · ${expanded ? '展示展开态' : '行驶收合态'}；尺寸与对象位置保持锁定。`
          : '车内v1 · 双侧展台、中央通道、凸出电路仓、凹入GX安装面及四固定镜头保持锁定。';
        cameraTween = {
          start: performance.now(),
          duration: instant ? 1 : 720,
          p0: camera.position.clone(),
          p1: new THREE.Vector3(...target.p),
          t0: controls.target.clone(),
          t1: new THREE.Vector3(...target.t),
          f0: camera.fov,
          f1: target.fov
        };
        viewName.textContent = target.label;
        viewNote.textContent = target.note;
        window.dispatchEvent(new Event('aiko-gx-view'));
      };

      root.querySelectorAll('[data-view]').forEach((button) => {
        button.addEventListener('click', () => {
          root.querySelectorAll('[data-view]').forEach((item) => {
            const active = item === button;
            item.classList.toggle('active', active);
            item.setAttribute('aria-selected', String(active));
          });
          moveCamera(button.dataset.view);
        });
      });
      root.querySelector('[data-pan]').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));controls.mouseButtons.LEFT=on?THREE.MOUSE.PAN:THREE.MOUSE.ROTATE;});
      resetButton.addEventListener('click', () => moveCamera(selectedView));
      openButton.addEventListener('click', () => {
        expanded = !expanded;
        wingTarget = expanded ? -1.56 : 0;
        roofTarget = expanded ? 0.34 : 0;
        openButton.setAttribute('aria-pressed', String(expanded));
        openButton.textContent = expanded ? '切换为行驶收合态' : '切换为展示展开态';
        const base = cameraViews[selectedView].label;
        viewName.textContent = `${base} · ${expanded ? '展示展开状态' : '行驶收合状态'}`;
        status.textContent = expanded
          ? '展示态：车顶三块组件朝玻璃侧倾斜，同宽棚板上翻；车身v01与车内v1均保持锁定。'
          : '行驶态：棚板覆盖玻璃区并与相邻车身外板齐平；车身v01与车内v1均保持锁定。';
      });

      const resize = () => {
        const width = Math.max(1, stage.clientWidth);
        const height = Math.max(1, stage.clientHeight);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      };
      new ResizeObserver(resize).observe(stage);
      resize();

      const render = (now) => {
        const dt = Math.min(0.05, render.lastTime ? (now - render.lastTime) / 1000 : 0.016);
        render.lastTime = now;
        wing.rotation.x += (wingTarget - wing.rotation.x) * Math.min(1, dt * 5.4);
        roofArray.rotation.x += (roofTarget - roofArray.rotation.x) * Math.min(1, dt * 5.4);
        updateExteriorSupports(wing.rotation.x, roofArray.rotation.x);
        if (cameraTween) {
          const raw = Math.min(1, (now - cameraTween.start) / cameraTween.duration);
          const eased = raw < 0.5 ? 4 * raw * raw * raw : 1 - Math.pow(-2 * raw + 2, 3) / 2;
          camera.position.lerpVectors(cameraTween.p0, cameraTween.p1, eased);
          controls.target.lerpVectors(cameraTween.t0, cameraTween.t1, eased);
          camera.fov = THREE.MathUtils.lerp(cameraTween.f0, cameraTween.f1, eased);
          camera.updateProjectionMatrix();
          if (raw >= 1) cameraTween = null;
        }
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      };

      window.aikoGxScene={scene,camera,world,controls,gxTouch,gxDimensions,moveCamera,cameraViews};
      loading.hidden = true;
      moveCamera('gx-installation', true);
      window.dispatchEvent(new Event('aiko-scene-ready'));
      requestAnimationFrame(render);
    };

    start().catch((error) => {
      loading.textContent = `全车总装母版加载失败：${error?.message || error}`;
      loading.setAttribute('role', 'alert');
      console.error(error);
    });
  </script>
</div>

<script src="../view-language.js"></script>
</body>
</html>
