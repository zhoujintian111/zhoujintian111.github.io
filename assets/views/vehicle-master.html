      const pvTexture = (() => {
        const el = document.createElement('canvas');
        el.width = 512;
        el.height = 768;
        const ctx = el.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 512, 768);
        gradient.addColorStop(0, '#050607');
        gradient.addColorStop(0.42, '#121517');
        gradient.addColorStop(1, '#060809');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 768);
        for (let x = 3; x < 512; x += 5) {
          ctx.fillStyle = x % 25 === 3 ? 'rgba(255,255,255,.028)' : 'rgba(255,255,255,.011)';
          ctx.fillRect(x, 0, 1, 768);
        }
        for (let y = 11; y < 768; y += 21) {
          ctx.fillStyle = 'rgba(255,255,255,.012)';
          ctx.fillRect(0, y, 512, 1);
        }
        const texture = new THREE.CanvasTexture(el);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      })();

      const roundedOutline = (height, width, radius, segments = 7) => {

        const corners = [
          [hy - r, hz - r, 0, Math.PI * 0.5],
          [hy - r, -hz + r, Math.PI * 0.5, Math.PI],
          [-hy + r, -hz + r, Math.PI, Math.PI * 1.5],
          [-hy + r, hz - r, Math.PI * 1.5, Math.PI * 2]
        ];
        const points = [];
        corners.forEach(([cy, cz, a0, a1]) => {
          for (let i = 0; i <= segments; i += 1) {
            const a = a0 + (a1 - a0) * (i / segments);
            points.push({ y: cy + Math.sin(a) * r, z: cz + Math.cos(a) * r });
          }
        });
        return points;
      };

      const roundedPrismGeometry = (depth, height, width, radius, segments = 7) => {
        const points = roundedOutline(height, width, radius, segments);
        const positions = [];
        const normals = [];
        const uvs = [];
        const push = (x, y, z, nx, ny, nz, u, v) => {
          positions.push(x, y, z);
          normals.push(nx, ny, nz);
          uvs.push(u, v);
        };
        const pushTri = (a, b, c, n) => {
          [a, b, c].forEach((p) => push(p.x, p.y, p.z, n.x, n.y, n.z, p.z / width + 0.5, p.y / height + 0.5));
        };
        const frontX = -depth * 0.5;
        const backX = depth * 0.5;
        for (let i = 0; i < points.length; i += 1) {
          const j = (i + 1) % points.length;
          const a = points[i];
          const b = points[j];
          pushTri(
            { x: frontX, y: 0, z: 0 },
            { x: frontX, y: a.y, z: a.z },
            { x: frontX, y: b.y, z: b.z },
            { x: -1, y: 0, z: 0 }
          );
          pushTri(
            { x: backX, y: 0, z: 0 },
            { x: backX, y: b.y, z: b.z },
            { x: backX, y: a.y, z: a.z },
            { x: 1, y: 0, z: 0 }
          );
          const dy = b.y - a.y;
          const dz = b.z - a.z;
          const length = Math.hypot(dy, dz) || 1;
          const sideNormal = { x: 0, y: -dz / length, z: dy / length };
          pushTri(
            { x: frontX, y: a.y, z: a.z },
            { x: backX, y: a.y, z: a.z },
            { x: backX, y: b.y, z: b.z },
            sideNormal
          );
          pushTri(
            { x: frontX, y: a.y, z: a.z },
            { x: backX, y: b.y, z: b.z },
            { x: frontX, y: b.y, z: b.z },
            sideNormal

        const tri = (a, b, c, n) => {

      }
      const gridGeometry = new THREE.BufferGeometry();
      gridGeometry.setAttribute('position', new THREE.Float32BufferAttribute(gridVertices, 3));
      exteriorWorld.add(new THREE.LineSegments(gridGeometry, new THREE.LineBasicMaterial({ color: theme.border, transparent: true, opacity: 0.20 })));

      // 恢复第一次车身展示的投影主光、冷色轮廓光和暖色补光。
      const exteriorKey = new THREE.PointLight(0xf4f8fa, 3.4, 0, 0);
      exteriorKey.position.set(-5.5, 9, 7.5);
      exteriorKey.castShadow = true;
      exteriorKey.shadow.mapSize.set(2048, 2048);
      exteriorKey.shadow.camera.left = -9;
      exteriorKey.shadow.camera.right = 9;
      exteriorKey.shadow.camera.top = 9;
      exteriorKey.shadow.camera.bottom = -9;
      exteriorKey.shadow.bias = -0.0003;
      scene.add(exteriorKey);
      const exteriorRim = new THREE.PointLight(0x8dc8de, 1.15, 0, 0);
      exteriorRim.position.set(7, 4, -6);
      scene.add(exteriorRim);
      const exteriorWarm = new THREE.PointLight(0xff7b41, 0.55, 10);
      exteriorWarm.position.set(-4, 3.2, 5);
      scene.add(exteriorWarm);

      const shadowPad = new THREE.Mesh(
        new THREE.PlaneGeometry(8.8, 4.8),
        new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.22 })
      );
      shadowPad.rotation.x = -Math.PI / 2;
      shadowPad.position.y = 0.49;
      shadowPad.receiveShadow = true;
      scene.add(shadowPad);

      const cameraViews = {
        'rear-left': {
          mode: 'exterior',
          p: [-8.3, 4.4, 8.2],
          t: [-0.55, 1.50, 0],
          fov: 37,
          label: '外观 1 · 左后侧',
          note: '车身v01展示态总览：车体、玻璃侧棚板、三块车顶组件和尾部悬挂组件。'
        },
        side: {
          mode: 'exterior',
          p: [-0.15, 3.05, 10.7],
          t: [-0.20, 1.56, 0],
          fov: 37,
          label: '外观 2 · 玻璃侧',
          note: '正侧校准玻璃门区域、同宽棚板，以及透过玻璃可见的内挂全黑组件。'
        },
        roof: {
          mode: 'exterior',
          p: [-4.1, 8.5, 6.5],
          t: [-1.25, 2.25, 0],
          fov: 37,
          label: '外观 3 · 车顶',
          note: '三块 1762 × 1134 × 30 mm 组件紧挨排列，并保持车身v01的倾斜方向。'
        },
        rear: {
          mode: 'exterior',
          p: [-10.2, 3.0, 2.8],
          t: [-2.55, 1.52, 0],
          fov: 37,
          label: '外观 4 · 尾部',
          note: '校验靠车尾内壁安装的全黑组件与后部车身关系。'
        },
        'rear-forward': {
          mode: 'interior',
          p: [-3.18, 1.50, 0.02],
          t: [0.58, 1.57, -0.04],
          fov: 43,
          label: '镜头 1 · 后部向前',
          note: '自然焦段校正纵宽失真；双侧展台、中央通道与凸出电路仓均处于同一视线。'
        },
        'module-side': {
          mode: 'interior',
          p: [-2.86, 1.52, -0.08],
          t: [-0.56, 1.70, 0.88],
          fov: 47,
          label: '镜头 2 · 组件侧',
          note: '沿中央通道斜看右侧组件、玻璃门和白色展台的连续关系。'
        },
        'tv-side': {
          mode: 'interior',
          p: [-1.05, 1.56, -0.04],
          t: [0.56, 1.74, -0.10],
          fov: 45,
          label: '镜头 3 · 电视侧',
          note: '正对凸出的电路仓展示面，确认电视、FIND YOUR POWER和AIKO标志。'
        },
        'front-diagonal': {
          mode: 'interior',
          p: [-0.02, 1.48, -0.70],
          t: [0.69, 1.90, 0.42],
          fov: 46,
          label: '镜头 4 · GX与玻璃门',
          note: '斜看电视墙与GX凹入窄面：GX中心略高于电视中心，并紧邻玻璃门。'
        },
        'gx-front': {
          mode: 'interior',
          p: [0.450, 2.180, 0.885],
          t: [0.812, 2.180, 0.915],
          fov: 28,
          label: '镜头 5 · GX正面',
          note: '大比例近景检查旧版Color Control GX：H130 × W120 × D28 mm，左侧贴沿且右侧距玻璃门100 mm。'
        }
      };

      let selectedView = 'rear-left';
      let cameraTween = null;
      const moveCamera = (name, instant = false) => {
        selectedView = name;
        const target = cameraViews[name];
        const exteriorMode = target.mode === 'exterior';
        exteriorWorld.visible = exteriorMode;
        world.visible = !exteriorMode;
        exteriorKey.visible = exteriorMode;
        exteriorRim.visible = exteriorMode;
        exteriorWarm.visible = exteriorMode;
        ceilingLight.visible = !exteriorMode;
        doorLight.visible = !exteriorMode;
        warmLight.visible = !exteriorMode;
        gxDetailLight.visible = name === 'gx-front';
        gxEdgeLight.visible = name === 'gx-front';
        shadowPad.visible = !exteriorMode;
        openButton.hidden = !exteriorMode;
        controls.minDistance = exteriorMode ? 5.1 : (name === 'gx-front' ? 0.22 : 0.7);
        controls.maxDistance = exteriorMode ? 18 : 6.8;
        controls.minPolarAngle = exteriorMode ? 0 : Math.PI * 0.18;
        controls.maxPolarAngle = exteriorMode ? Math.PI * 0.49 : Math.PI * 0.78;
        controls.enablePan = exteriorMode;
        renderer.toneMappingExposure = exteriorMode ? 0.83 : (name === 'gx-front' ? 0.70 : 0.76);
        scene.fog.density = exteriorMode ? 0.026 : 0.018;
        status.textContent = exteriorMode
          ? `车身v01 · ${expanded ? '展示展开态' : '行驶收合态'}；尺寸与对象位置保持锁定。`
          : '车内v1 · 双侧展台、中央通道、凸出电路仓、凹入GX安装面及四固定镜头保持锁定。';
        cameraTween = {
          start: performance.now(),
          duration: instant ? 1 : 720,
          p0: camera.position.clone(),
          p1: new THREE.Vector3(...target.p),
          t0: controls.target.clone(),
          t1: new THREE.Vector3(...target.t),
          f0: camera.fov,
          f1: target.fov
        };
        viewName.textContent = target.label;
        viewNote.textContent = target.note;
      };

      root.querySelectorAll('[data-view]').forEach((button) => {
        button.addEventListener('click', () => {
          root.querySelectorAll('[data-view]').forEach((item) => {
            const active = item === button;
            item.classList.toggle('active', active);
            item.setAttribute('aria-selected', String(active));
          });
          moveCamera(button.dataset.view);
        });
      });
      resetButton.addEventListener('click', () => moveCamera(selectedView));
      openButton.addEventListener('click', () => {
        expanded = !expanded;
        wingTarget = expanded ? -1.56 : 0;
        roofTarget = expanded ? 0.34 : 0;
        openButton.setAttribute('aria-pressed', String(expanded));
        openButton.textContent = expanded ? '切换为行驶收合态' : '切换为展示展开态';
        const base = cameraViews[selectedView].label;
        viewName.textContent = `${base} · ${expanded ? '展示展开状态' : '行驶收合状态'}`;
        status.textContent = expanded
          ? '展示态：车顶三块组件朝玻璃侧倾斜，同宽棚板上翻；车身v01与车内v1均保持锁定。'
          : '行驶态：棚板覆盖玻璃区并与相邻车身外板齐平；车身v01与车内v1均保持锁定。';
      });

      const resize = () => {
        const width = Math.max(1, stage.clientWidth);
        const height = Math.max(1, stage.clientHeight);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      };
      new ResizeObserver(resize).observe(stage);
      resize();

      const render = (now) => {
        const dt = Math.min(0.05, render.lastTime ? (now - render.lastTime) / 1000 : 0.016);
        render.lastTime = now;
        wing.rotation.x += (wingTarget - wing.rotation.x) * Math.min(1, dt * 5.4);
        roofArray.rotation.x += (roofTarget - roofArray.rotation.x) * Math.min(1, dt * 5.4);
        updateExteriorSupports(wing.rotation.x, roofArray.rotation.x);
        if (cameraTween) {
          const raw = Math.min(1, (now - cameraTween.start) / cameraTween.duration);
          const eased = raw < 0.5 ? 4 * raw * raw * raw : 1 - Math.pow(-2 * raw + 2, 3) / 2;
          camera.position.lerpVectors(cameraTween.p0, cameraTween.p1, eased);
          controls.target.lerpVectors(cameraTween.t0, cameraTween.t1, eased);
          camera.fov = THREE.MathUtils.lerp(cameraTween.f0, cameraTween.f1, eased);
          camera.updateProjectionMatrix();
          if (raw >= 1) cameraTween = null;
        }
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      };

      loading.hidden = true;
      moveCamera('rear-left', true);
      requestAnimationFrame(render);
    };

    start().catch((error) => {
      loading.textContent = `全车总装母版加载失败：${error?.message || error}`;
      loading.setAttribute('role', 'alert');
      console.error(error);
    });
  </script>
</div>

<script src="../view-language.js"></script>
</body>
</html>
